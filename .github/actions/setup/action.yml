name: "Setup tools"
inputs:
  save-cache:
    description: |
      Whether to save the pnpm store cache at the end of the job. Off by
      default: pull request caches are scoped to refs/pull/N/merge and cannot
      be restored by other PRs, so only the push-to-main workflow saves the
      cache every PR restores from.
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.x
    - name: Install pnpm and Node.js
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        save-cache: ${{ inputs.save-cache }}
        cache-dependency-path: |
          pnpm-lock.yaml
          app/pnpm-lock.yaml
